services:
  backend:
    container_name: pagif-backend
    image: ifrs/pagif-backend:latest
    build: ./backend/
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      - logs:/home/node/app/logs
  frontend:
    container_name: pagif-frontend
    image: ifrs/pagif-frontend:latest
    build: ./frontend/
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NITRO_HOST=${NITRO_HOST:-0.0.0.0}
      - NITRO_PORT=${NITRO_PORT:-3000}
      - NITRO_SHUTDOWN=true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    ports:
      - "${DOCKER_PORT:-3000}:${NITRO_PORT:-3000}"
volumes:
  logs:
